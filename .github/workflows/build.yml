
name: Build Flutter APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Java versions
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Create Android scaffolding if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name=speed_line --platforms=android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speed-line-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
